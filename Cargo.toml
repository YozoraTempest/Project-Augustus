[workspace]
members = ["crates/augustus-eu4", "tools/eu4-inspect"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
jomini = { version = "0.37.1", default-features = false }
walkdir = "2.5"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
