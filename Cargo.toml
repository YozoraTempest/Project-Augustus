[workspace]
members = ["crates/augustus-core", "crates/augustus-eu4", "apps/augustus-cli"]
default-members = ["apps/augustus-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
image = { version = "0.25", default-features = false, features = ["bmp"] }
jomini = { version = "0.37", default-features = false }
tempfile = "3"
thiserror = "2"
