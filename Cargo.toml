# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = ["crates/augustus-core", "crates/augustus-eu4", "crates/augustus-demo", "crates/augustus-godot", "tools/eu4-inspect", "tools/augustus-run"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
jomini = { version = "0.37.1", default-features = false }
walkdir = "2.5"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
godot = { version = "0.5.5", features = ["api-4-7"] }
rand_chacha = { version = "0.10", features = ["serde"] }
