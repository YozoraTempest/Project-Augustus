name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - name: Build
        run: cargo build --workspace --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Run CLI
        run: |
          cargo run --locked
          cargo run --locked -- --help
          cargo run --locked -- --version
      - name: Install Godot
        env:
          GODOT_VERSION: 4.7.2
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          version = os.environ["GODOT_VERSION"]
          platform = "win64.exe" if os.name == "nt" else "linux.x86_64"
          name = f"Godot_v{version}-stable_{platform}"
          directory = Path(os.environ["RUNNER_TEMP"]) / "godot"
          archive = directory.with_suffix(".zip")
          url = f"https://github.com/godotengine/godot/releases/download/{version}-stable/{name}.zip"
          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as package:
              package.extractall(directory)
          filename = name.replace("win64.exe", "win64_console.exe")
          executable = directory / filename
          executable.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"GODOT_COMMAND={executable.as_posix()}\n")
          PY
      - name: Import Godot project
        run: '"$GODOT_COMMAND" --headless --path godot --editor --import'
      - name: Test Godot game flow and map
        run: '"$GODOT_COMMAND" --headless --path godot --script res://tests/map_view_test.gd'
      - name: Test Godot command-line startup
        run: '"$GODOT_COMMAND" --headless --path godot --script res://tests/startup_test.gd -- --game-dir "$GITHUB_WORKSPACE/godot/tests/data/game" --country AAA'
      - name: Test Godot startup without player country
        run: '"$GODOT_COMMAND" --headless --path godot --script res://tests/startup_test.gd -- --game-dir "$GITHUB_WORKSPACE/godot/tests/data/game"'
      - name: Test Godot startup with invalid player country
        run: '"$GODOT_COMMAND" --headless --path godot --script res://tests/startup_test.gd -- --game-dir "$GITHUB_WORKSPACE/godot/tests/data/game" --country ZZZ'
      - name: Test Godot map modes
        run: '"$GODOT_COMMAND" --headless --path godot --script res://tests/map_modes_test.gd'
      - name: Test Godot globe map
        run: '"$GODOT_COMMAND" --headless --path godot --script res://tests/globe_map_test.gd'
      - name: Test Godot player country selection
        run: '"$GODOT_COMMAND" --headless --path godot --script res://tests/country_selection_test.gd'
