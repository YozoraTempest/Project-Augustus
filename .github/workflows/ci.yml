name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  PYTHONUTF8: "1"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - name: Build
        run: cargo build --workspace --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}
      - name: Install Godot
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          version = os.environ["GODOT_VERSION"]
          platform = "win64.exe" if os.name == "nt" else "linux.x86_64"
          name = f"Godot_v{version}-stable_{platform}"
          directory = Path(os.environ["RUNNER_TEMP"]) / "godot"
          filename = name.replace("win64.exe", "win64_console.exe")
          executable = directory / filename
          if not executable.is_file():
              archive = directory.with_suffix(".zip")
              # 两处均为 Godot 官方发布，避免单个发布地址持续 504 阻断检查。
              repositories = ("godotengine/godot-builds", "godotengine/godot")
              for repository in repositories:
                  url = f"https://github.com/{repository}/releases/download/{version}-stable/{name}.zip"
                  try:
                      # curl 对临时错误有限重试；所有官方地址失败时仍让 CI 失败。
                      subprocess.run([
                          "curl", "--fail", "--location", "--retry", "5",
                          "--retry-delay", "3", "--retry-max-time", "300",
                          "--connect-timeout", "30", "--max-time", "120",
                          "--output", str(archive), url,
                      ], check=True)
                      break
                  except subprocess.CalledProcessError:
                      if repository == repositories[-1]:
                          raise
                      print("下载失败，改用另一官方发布地址", flush=True)
              with zipfile.ZipFile(archive) as package:
                  package.extractall(directory)
          executable.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"GODOT_COMMAND={executable.as_posix()}\n")
          PY
      - name: Import Godot project
        run: |
          # Godot 4.7 在冷启动 headless 导入里第一次发现 GDExtension 时，
          # 会在退出阶段崩溃（godotengine/godot#111645）。预先登记扩展，让它在启动时加载。
          mkdir -p godot/.godot
          printf '%s\n' 'res://augustus.gdextension' > godot/.godot/extension_list.cfg
          "$GODOT_COMMAND" --headless --path godot --editor --import
